<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1d22" />
    <title>Hard Truck Web</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <header id="bar">
      <select id="playMode" aria-label="Режим порту">
        <option value="career">Кар'єра</option>
        <option value="test">Тест</option>
      </select>
      <select id="level" aria-label="Локація"></select>
      <select id="mode" aria-label="Набір ресурсів">
        <option value="hw">3D-прискорювач</option>
        <option value="sw">програмний</option>
      </select>
      <div class="tabs" role="tablist">
        <button data-tab="scene" class="active" role="tab">Сцена</button>
        <button data-tab="textures" role="tab">Текстури</button>
        <button data-tab="masks" role="tab">Маски</button>
        <button data-tab="trucks" role="tab">Техніка</button>
        <button data-tab="drive" role="tab">Їзда</button>
      </div>
      <select id="truck" aria-label="Вантажівка" hidden></select>
      <select id="weather" aria-label="Погода (тестовий режим)">
        <option value="dry">Сухо</option>
        <option value="rain">Дощ</option>
      </select>
      <select id="quality" aria-label="Якість рендера"></select>
      <button id="fpsToggle" aria-label="Лічильник кадрів">fps</button>
      <button id="options" aria-label="Опції">⚙</button>
      <button id="toMenu" aria-label="Головне меню">Меню</button>
      <button id="fullscreen" aria-label="На весь екран">⛶</button>
    </header>
    <div id="stats"></div>
    <div id="fps" hidden></div>
    <div id="gallery" hidden></div>
    <div id="overlay"></div>
    <button id="menu" aria-label="Меню" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div id="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
