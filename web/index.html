<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1d22" />
    <!-- Сайт для власної гри (GitHub Pages) — не показувати в пошукових системах. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Hard Truck Web</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <header id="bar">
      <select id="playMode" aria-label="Режим порту">
        <option value="career">Кар'єра</option>
        <option value="test">Тест</option>
      </select>
      <select id="level" aria-label="Локація"></select>
      <div class="tabs" role="tablist">
        <button data-tab="scene" class="active" role="tab">Сцена</button>
        <button data-tab="textures" role="tab">Текстури</button>
        <button data-tab="masks" role="tab">Маски</button>
        <button data-tab="trucks" role="tab">Техніка</button>
        <button data-tab="drive" role="tab">Їзда</button>
      </div>
      <select id="truck" aria-label="Вантажівка" hidden></select>
      <select id="weather" aria-label="Погода (тестовий режим)">
        <option value="dry">Сухо</option>
        <option value="rain">Дощ</option>
      </select>
      <select id="rivals" aria-label="Кількість суперників (тестовий режим)"></select>
      <select id="quality" aria-label="Якість рендера"></select>
      <button id="fpsToggle" aria-label="Лічильник кадрів">fps</button>
      <button id="options" aria-label="Опції"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/><circle cx="12" cy="12" r="6.5"/></svg></button>
      <button id="swapToggle" aria-label="Поміняти місцями кермо й педалі"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><rect x="1.5" y="8.5" width="7" height="7" rx="1.4"/><rect x="15.5" y="8.5" width="7" height="7" rx="1.4"/><path d="M3.9 12l2.4-1.6v3.2zM20.1 12l-2.4-1.6v3.2z" fill="currentColor" stroke-width="1"/><path d="M8 6.6c2.3-2.6 5.7-2.6 8 0M16 17.4c-2.3 2.6-5.7 2.6-8 0"/><path d="M16.6 4.7l-.4 2.4-2.3-.5M7.4 19.3l.4-2.4 2.3.5"/></svg></button>
      <button id="toMenu" aria-label="Головне меню"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7.5 9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg></button>
      <button id="fullscreen" aria-label="На весь екран"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9V3.5H9M15 3.5h5.5V9M20.5 15v5.5H15M9 20.5H3.5V15"/></svg></button>
    </header>
    <div id="stats"></div>
    <div id="fps" hidden></div>
    <div id="gallery" hidden></div>
    <div id="overlay"></div>
    <button id="menu" aria-label="Технічне меню" hidden><svg class="icon-touch" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6.5V4a2.5 2.5 0 0 1 2.5-2.5h6A2.5 2.5 0 0 1 20.5 4v16a2.5 2.5 0 0 1-2.5 2.5h-6A2.5 2.5 0 0 1 9.5 20v-2.5"/><path d="M13.2 1.6c.2 1 .8 1.4 1.8 1.4s1.6-.4 1.8-1.4"/><circle cx="7" cy="12" r="3.3"/><circle cx="7" cy="12" r="1.2"/><path stroke-width="2.2" d="M10.30 12.00L12.00 12.00M9.33 14.33L10.54 15.54M7.00 15.30L7.00 17.00M4.67 14.33L3.46 15.54M3.70 12.00L2.00 12.00M4.67 9.67L3.46 8.46M7.00 8.70L7.00 7.00M9.33 9.67L10.54 8.46"/></svg><svg class="icon-desktop" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg></button>
    <div id="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
