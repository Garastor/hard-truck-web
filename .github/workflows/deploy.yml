# Розгортання гри на GitHub Pages: на кожен push у main — перевірка типів, тести, збірка web/dist і викладення.
# На сайт потрапляє лише код порту (web/dist); файлів гри в репозиторії немає — гравець імпортує свій HardTruck.zip.
# Тести на справжніх файлах гри без них пропускаються (describe.skipIf).
name: Розгортання на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одночасно — лише одне розгортання; новіший push скасовує старіше, що ще йде.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
